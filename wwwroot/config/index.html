<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gateway Config</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/config/app.css" />
</head>
<body>
  <div class="shell">
    <!-- Four columns: machines | the machine's buttons | content | General. Drag the grip lines to resize. -->
    <div class="window" id="window">
      <!-- Other machines (shared mapping) | one tab per machine (with its connection dot) | + -->
      <nav class="tabs" id="tabs" role="tablist" aria-label="Machines" aria-orientation="vertical"></nav>
      <div class="grip" data-col="tabs" role="separator" aria-orientation="vertical" aria-label="Resize the machine list" tabindex="0"></div>

      <aside class="side">
        <h1 id="tabTitle">Other machines</h1>
        <button class="nav" data-view="point-map">PointMap</button>
        <button class="nav" data-view="timestamp-rules">TimeStamp</button>
        <button class="nav" data-view="outbox">Outbox</button>
      </aside>
      <div class="grip" data-col="side" role="separator" aria-orientation="vertical" aria-label="Resize the machine buttons" tabindex="0"></div>

      <main class="panel">
        <!-- Ongoing problems (MES / MQTT unreachable, gateway stopped): one line each, gone when solved -->
        <div class="alerts" id="alerts" role="status" hidden></div>

        <div class="searchbar">
          <input id="search" type="search" aria-label="Search" />
          <button id="searchBtn" type="button">Search</button>
        </div>

        <p class="scope-hint" id="scopeHint" hidden></p>

        <div class="picker-row" id="pickerRow">
          <select id="picker" aria-label="Data group"></select>
          <span class="hint" id="pickerHint"></span>
        </div>

        <div id="view" class="view"></div>

        <div class="footer">
          <span class="note" id="note"></span>
          <button id="saveBtn" class="save" type="button">save</button>
        </div>
      </main>
      <div class="grip" data-col="general" role="separator" aria-orientation="vertical" aria-label="Resize General" tabindex="0"></div>

      <!-- Gateway-wide settings and views, always on the right -->
      <aside class="side general-side">
        <h1>General</h1>
        <button class="nav active" data-view="mqtt-config">MQTTConfig</button>
        <button class="nav" data-view="machine-config">GatewayConfig</button>
        <button class="nav" data-view="machines">Machines</button>
        <button class="nav" data-view="failed">MES failures</button>
        <button class="nav" data-view="log">Log</button>
        <div class="gw-status" id="gwStatus">
          <span class="dot"></span><span id="gwText">checking gateway…</span>
          <span id="gwStats" class="gw-stats"></span>
          <button id="errBadge" class="err-badge" type="button" hidden></button>
        </div>
      </aside>
    </div>
  </div>

  <dialog id="restartDialog">
    <p class="dlg-title">Saved</p>
    <p id="restartText">Restart the gateway now?</p>
    <p class="dlg-small">Connected machines are dropped for a moment and must reconnect.</p>
    <div class="dlg-buttons">
      <button id="restartLater" type="button">Later</button>
      <button id="restartNow" type="button" class="primary">Restart now</button>
    </div>
  </dialog>

  <div id="busy" class="busy" hidden><div class="busy-box" id="busyText">Restarting gateway…</div></div>
  <div id="toast" class="toast" role="status"></div>
  <script src="/config/app.js"></script>
</body>
</html>
