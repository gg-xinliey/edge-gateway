<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edge Gateway Workflow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Edge Gateway (RES API – TCP)</p>
    <h1>How one line travels through the Edge Gateway</h1>

    <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gateway-workflow-title gateway-workflow-desc">
      <title id="gateway-workflow-title">How one line travels through the Edge Gateway</title>
      <desc id="gateway-workflow-desc">Flowchart showing how each TCP line from the machines is either published to the MQTT broker when its topic is IO or motion, or normalized, checked for changes, batched per interval, kept in the daily outbox and posted to the MES API.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ Arrows (drawn first, behind nodes) ============ -->
      <!-- Machines -> TCP ingest -->
      <line x1="140" y1="128" x2="140" y2="176" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- TCP ingest -> decision -->
      <line x1="140" y1="232" x2="140" y2="272" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- decision NO -> Normalize (MES path) -->
      <line x1="240" y1="320" x2="320" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Normalize -> Change check -->
      <line x1="496" y1="320" x2="568" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Change check -> Outbox -->
      <line x1="768" y1="320" x2="840" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Outbox -> MES API (external HTTP) -->
      <line x1="1000" y1="320" x2="1072" y2="320" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- decision YES -> MQTT relay (down, then right; r=8 elbow) -->
      <path d="M 140 368 V 496 Q 140 504 148 504 H 320" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- MQTT relay -> broker (external MQTT) -->
      <line x1="520" y1="504" x2="592" y2="504" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

      <!-- ============ Arrow labels (mask 8px above the line) ============ -->
      <rect x="268" y="300" width="24" height="12" rx="2" fill="#f5f5f5"/>
      <text x="280" y="309" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

      <rect x="150" y="426" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="164" y="435" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>

      <rect x="506" y="300" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="532" y="309" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BY GROUP</text>

      <rect x="776" y="300" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="804" y="309" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ENVELOPES</text>

      <rect x="1008" y="300" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="1036" y="309" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTP POST</text>

      <rect x="534" y="484" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="556" y="493" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PUBLISH</text>

      <!-- ============ Nodes ============ -->
      <!-- Start: Machines (oval) -->
      <rect x="40" y="72" width="200" height="56" rx="28" fill="#f5f5f5"/>
      <rect x="40" y="72" width="200" height="56" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="140" y="98" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Machines</text>
      <text x="140" y="112" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">~50 · one JSON per line</text>

      <!-- Step: TCP ingest -->
      <rect x="40" y="176" width="200" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="176" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="140" y="202" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">TCP ingest</text>
      <text x="140" y="216" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">192.168.250.78:9000</text>

      <!-- Decision: IO / motion topic? -->
      <polygon points="140,272 240,320 140,368 40,320" fill="#f5f5f5"/>
      <polygon points="140,272 240,320 140,368 40,320" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="140" y="318" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">IO / motion</text>
      <text x="140" y="332" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">topic?</text>

      <!-- Step: Normalize -->
      <rect x="320" y="292" width="176" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="320" y="292" width="176" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="408" y="318" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Normalize</text>
      <text x="408" y="332" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">needs machine_id · point-map</text>

      <!-- Focal step: Change check + interval -->
      <rect x="568" y="288" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="568" y="288" width="200" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="668" y="312" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Change check + interval</text>
      <text x="668" y="327" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">machine · source · group</text>
      <text x="668" y="340" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">UTC times · sendEveryMs</text>

      <!-- Store: Outbox -->
      <rect x="840" y="292" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="840" y="292" width="160" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="920" y="318" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Outbox</text>
      <text x="920" y="332" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">daily SQLite · 7 days</text>

      <!-- End: MES API (oval, external) -->
      <rect x="1072" y="292" width="160" height="56" rx="28" fill="#f5f5f5"/>
      <rect x="1072" y="292" width="160" height="56" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="1152" y="318" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">MES API</text>
      <text x="1152" y="332" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">retries · same event_id</text>

      <!-- Step: MQTT relay -->
      <rect x="320" y="476" width="200" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="320" y="476" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="420" y="502" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">MQTT relay</text>
      <text x="420" y="516" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">4 endings · others dropped</text>

      <!-- End: MQTT broker (oval, external) -->
      <rect x="592" y="476" width="160" height="56" rx="28" fill="#f5f5f5"/>
      <rect x="592" y="476" width="160" height="56" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="672" y="502" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">MQTT broker</text>
      <text x="672" y="516" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">192.168.251.189:1883</text>

      <!-- ============ Callouts (margin, drawn last) ============ -->
      <!-- Focal aside: the duplicate rule -->
      <text x="488" y="228" fill="#eb6c36" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">same values as last time are not sent</text>
      <path d="M 600 236 Q 648 252 667 285" fill="none" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="668" cy="288" r="2" fill="#eb6c36"/>

      <!-- Neutral aside: MES outage -->
      <text x="1232" y="228" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">MES down: rows wait here and are sent later, in order</text>
      <path d="M 968 236 Q 936 252 921 289" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="920" cy="292" r="2" fill="#2d3142"/>

      <!-- ============ Legend (bottom strip) ============ -->
      <line x1="40" y1="600" x2="1240" y2="600" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="616" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>

      <rect x="40" y="632" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="72" y="642" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Start / end (oval)</text>

      <rect x="200" y="632" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="232" y="642" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Step</text>

      <polygon points="360,638 372,632 384,638 372,644" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="396" y="642" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Decision</text>

      <rect x="520" y="632" width="24" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="552" y="642" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Store</text>

      <rect x="680" y="632" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="712" y="642" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal step</text>

      <line x1="840" y1="638" x2="868" y2="638" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="876" y="642" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Inside the gateway</text>

      <line x1="1000" y1="638" x2="1028" y2="638" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="1036" y="642" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">To an outside system (HTTP / MQTT)</text>
    </svg>
  </div>
</body>
</html>
