<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edge Gateway Workflow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    .diagram { overflow-x: auto; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Edge Gateway (RES API – TCP)</p>
    <h1>How one line travels through the Edge Gateway</h1>

    <div class="diagram">
    <svg viewBox="0 0 1280 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gateway-workflow-title gateway-workflow-desc">
      <title id="gateway-workflow-title">How one line travels through the Edge Gateway</title>
      <desc id="gateway-workflow-desc">Flowchart showing each TCP line from a machine adapter either relayed to the MQTT broker when it is IO or motion, or held without a reply when the machine has no tab or sends unknown tags, or mapped (joined tags a+b become a_b) and checked for changes, saved to the outbox, acknowledged to the adapter, and posted to the MES API with only the MES table columns.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ Arrows (drawn first, behind nodes) ============ -->
      <!-- Machines -> TCP ingest -->
      <line x1="140" y1="128" x2="140" y2="168" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- TCP ingest -> IO/motion? -->
      <line x1="140" y1="232" x2="140" y2="272" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- IO/motion? YES -> MQTT broker -->
      <line x1="140" y1="368" x2="140" y2="476" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- IO/motion? NO -> tab + tags known? -->
      <line x1="240" y1="320" x2="320" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- tab + tags known? NO -> Held -->
      <line x1="420" y1="368" x2="420" y2="476" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <!-- tab + tags known? YES -> Change check -->
      <line x1="520" y1="320" x2="584" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Change check -> Outbox -->
      <line x1="784" y1="320" x2="856" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Outbox -> MES API -->
      <line x1="1016" y1="320" x2="1088" y2="320" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- Outbox -> ack back to the machine (up, left, down; r=8 elbows) -->
      <path d="M 936 292 V 48 Q 936 40 928 40 H 208 Q 200 40 200 48 V 72" fill="none" stroke="#eb6c36" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>

      <!-- ============ Arrow labels (mask, 8px gap) ============ -->
      <rect x="150" y="416" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="164" y="425" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>

      <rect x="268" y="300" width="24" height="12" rx="2" fill="#f5f5f5"/>
      <text x="280" y="309" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

      <rect x="430" y="416" width="24" height="12" rx="2" fill="#f5f5f5"/>
      <text x="442" y="425" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

      <rect x="538" y="300" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="552" y="309" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>

      <rect x="792" y="300" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="820" y="309" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CHANGES</text>

      <rect x="1024" y="300" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="1052" y="309" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTP POST</text>

      <rect x="520" y="20" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="568" y="29" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ACK AFTER SAVE</text>

      <!-- ============ Nodes ============ -->
      <!-- Start: Machines (oval) -->
      <rect x="40" y="72" width="200" height="56" rx="28" fill="#f5f5f5"/>
      <rect x="40" y="72" width="200" height="56" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="140" y="98" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Machine adapters</text>
      <text x="140" y="112" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">keep each line until ack</text>

      <!-- Step: TCP ingest -->
      <rect x="40" y="168" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="168" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="140" y="192" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">TCP ingest</text>
      <text x="140" y="206" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">192.168.250.78:9000</text>
      <text x="140" y="219" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">repeat message_id = ack</text>

      <!-- Decision: IO / motion? -->
      <polygon points="140,272 240,320 140,368 40,320" fill="#f5f5f5"/>
      <polygon points="140,272 240,320 140,368 40,320" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="140" y="318" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">IO / motion</text>
      <text x="140" y="332" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">topic?</text>

      <!-- Decision: tab + tags known? -->
      <polygon points="420,272 520,320 420,368 320,320" fill="#f5f5f5"/>
      <polygon points="420,272 520,320 420,368 320,320" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="420" y="318" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tab + tags</text>
      <text x="420" y="332" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">known?</text>

      <!-- Step: Change check -->
      <rect x="584" y="280" width="200" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="584" y="280" width="200" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="684" y="304" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Map + change check</text>
      <text x="684" y="319" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">machine · source · group</text>
      <text x="684" y="332" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">UTC times · sendEveryMs</text>
      <text x="684" y="345" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">MES columns only · a+b → a_b</text>

      <!-- Focal store: Outbox -->
      <rect x="856" y="292" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="856" y="292" width="160" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="936" y="318" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Outbox</text>
      <text x="936" y="332" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SQLite · per machine</text>

      <!-- End: MES API (oval, external) -->
      <rect x="1088" y="292" width="160" height="56" rx="28" fill="#f5f5f5"/>
      <rect x="1088" y="292" width="160" height="56" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="1168" y="314" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">MES API</text>
      <text x="1168" y="328" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">2xx sent · 4xx failed</text>
      <text x="1168" y="340" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">else retry 2–60 s</text>

      <!-- End: MQTT broker (oval, external) -->
      <rect x="40" y="476" width="200" height="56" rx="28" fill="#f5f5f5"/>
      <rect x="40" y="476" width="200" height="56" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="140" y="502" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">MQTT broker</text>
      <text x="140" y="516" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">relayed live · no reply</text>

      <!-- Held (optional / waiting) -->
      <rect x="320" y="476" width="200" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="320" y="476" width="200" height="56" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="420" y="502" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Held · no reply</text>
      <text x="420" y="516" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">fix tab · adapter resends</text>

      <!-- ============ Callouts ============ -->
      <text x="584" y="236" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">same values as last time are not sent, even after a restart</text>
      <path d="M 660 244 Q 676 256 683 277" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="684" cy="280" r="2" fill="#2d3142"/>

      <text x="1248" y="420" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">MES down: rows wait in the outbox, sent later in order</text>
      <text x="1248" y="438" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">retry wait 2 → 4 → 8 → 16 → 32 → 60 s, then every 60 s</text>
      <text x="1248" y="451" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">4xx: failed messages, re-send by hand</text>
      <path d="M 1168 404 Q 1168 376 1168 351" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="1168" cy="348" r="2" fill="#2d3142"/>

      <!-- ============ Legend (bottom strip) ============ -->
      <line x1="40" y1="600" x2="1240" y2="600" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="616" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>

      <rect x="40" y="632" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="72" y="642" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Start / end</text>

      <rect x="176" y="632" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="208" y="642" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Step</text>

      <polygon points="288,638 300,632 312,638 300,644" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="320" y="642" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Decision</text>

      <rect x="400" y="632" width="24" height="12" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="432" y="642" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Waiting</text>

      <rect x="512" y="632" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="544" y="642" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Store (on disk)</text>

      <line x1="664" y1="638" x2="692" y2="638" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="700" y="642" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Inside the gateway</text>

      <line x1="832" y1="638" x2="860" y2="638" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="868" y="642" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">To an outside system</text>

      <line x1="1016" y1="638" x2="1044" y2="638" stroke="#eb6c36" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
      <text x="1052" y="642" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Reply to the adapter</text>
    </svg>
    </div>
  </div>
</body>
</html>
